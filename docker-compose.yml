services:
  ai-browser-agent:
    build: .
    container_name: ai-browser-agent-api
    restart: unless-stopped
    env_file: .env
    environment:
      HEADLESS: "false"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - browser-profile:/app/browser-profile
      - agent-data:/app/data
    init: true
    shm_size: "1gb"

volumes:
  browser-profile:
  agent-data:
