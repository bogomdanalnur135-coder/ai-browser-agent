<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Browser Agent — CAPTCHA Lab</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    main {
      background: white;
      padding: 30px;
      border-radius: 12px;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Browser Agent — CAPTCHA Test Lab</h1>
    <p>Локальная тестовая страница для проверки взаимодействия агента с CAPTCHA.</p>

    <form id="captcha-form">
      <div
        class="g-recaptcha"
        data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI">
      </div>

      <button type="submit">Проверить CAPTCHA</button>
    </form>

    <p id="result">Ожидание прохождения проверки.</p>
  </main>

  <script>
    document.getElementById("captcha-form").addEventListener("submit", function(event) {
      event.preventDefault();

      const response = document.querySelector(
        '[name="g-recaptcha-response"]'
      );

      const result = document.getElementById("result");

      if (response && response.value.length > 0) {
        result.textContent = "CAPTCHA пройдена в тестовом режиме!";
      } else {
        result.textContent = "Сначала необходимо пройти CAPTCHA.";
      }
    });
  </script>
</body>
</html>
